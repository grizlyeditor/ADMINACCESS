<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Reward System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, where, query, updateDoc, doc } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAIocBYNxKbvhEd5dXZy9xtCMVIc7b1PLE",
            authDomain: "visualhosting-88a92.firebaseapp.com",
            projectId: "visualhosting-88a92",
            storageBucket: "visualhosting-88a92.firebasestorage.app",
            messagingSenderId: "364627318409",
            appId: "1:364627318409:web:b047ac4db8cdc3b254d858",
            measurementId: "G-5GV65EXGH4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // DOM Elements
        const loginForm = document.getElementById('login-form');
        const adminPanel = document.getElementById('admin-panel');
        const rewardsContainer = document.getElementById('rewards-container');
        const addRewardBtn = document.getElementById('add-reward-btn');
        const addRewardModal = document.getElementById('add-reward-modal');
        const closeModal = document.getElementById('close-modal');
        const rewardForm = document.getElementById('reward-form');
        const logoutBtn = document.getElementById('logout-btn');
        const loadingIndicator = document.getElementById('loading-indicator');
        const errorMessage = document.getElementById('error-message');

        // State variables
        let currentUser = null;

        // Initialize the app
        function initApp() {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    showAdminPanel();
                    loadRewards();
                } else {
                    showLoginForm();
                }
            });
        }

        // Show admin panel
        function showAdminPanel() {
            loginForm.classList.add('hidden');
            adminPanel.classList.remove('hidden');
        }

        // Show login form
        function showLoginForm() {
            adminPanel.classList.add('hidden');
            loginForm.classList.remove('hidden');
        }

        // Handle login
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            loadingIndicator.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    currentUser = userCredential.user;
                    showAdminPanel();
                    loadRewards();
                })
                .catch((error) => {
                    errorMessage.textContent = error.message;
                    errorMessage.classList.remove('hidden');
                })
                .finally(() => {
                    loadingIndicator.classList.add('hidden');
                });
        }

        // Load rewards from Firestore
        async function loadRewards() {
            rewardsContainer.innerHTML = `
                <div class="text-center py-12">
                    <i class="fas fa-spinner fa-spin text-3xl text-blue-500 mb-4"></i>
                    <p class="text-gray-600">Loading rewards...</p>
                </div>
            `;

            try {
                const q = query(collection(db, "rewards"), where("adminId", "==", currentUser.uid));
                const querySnapshot = await getDocs(q);
                
                rewardsContainer.innerHTML = '';

                if (querySnapshot.empty) {
                    rewardsContainer.innerHTML = `
                        <div class="col-span-3 text-center py-12">
                            <div class="bg-gray-100 rounded-xl p-8">
                                <i class="fas fa-gift text-4xl text-gray-400 mb-4"></i>
                                <h3 class="text-xl font-semibold text-gray-700 mb-2">No Rewards Yet</h3>
                                <p class="text-gray-500">Click the "Add New Reward" button to create your first reward offer.</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const reward = {
                        id: doc.id,
                        ...doc.data()
                    };
                    renderReward(reward);
                });
            } catch (error) {
                console.error("Error loading rewards: ", error);
                rewardsContainer.innerHTML = `
                    <div class="col-span-3 text-center py-12">
                        <div class="bg-red-50 rounded-xl p-8">
                            <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
                            <h3 class="text-xl font-semibold text-red-700 mb-2">Error Loading Rewards</h3>
                            <p class="text-red-500">${error.message}</p>
                        </div>
                    </div>
                `;
            }
        }

        // Render a single reward card
        function renderReward(reward) {
            const isOnline = reward.redemptions < reward.maxRedemptions;
            
            const rewardElement = document.createElement('div');
            rewardElement.className = 'bg-white rounded-xl shadow-md overflow-hidden relative p-6';
            rewardElement.innerHTML = `
                <div class="absolute top-4 right-4 px-3 py-1 rounded-full text-xs font-semibold ${isOnline ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                    ${isOnline ? 'ONLINE' : 'OFFLINE'}
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">${reward.mainMessage}</h3>
                <p class="text-gray-600 mb-4">${reward.rewardDescription}</p>
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <span class="text-sm text-gray-500">Code:</span>
                        <span class="font-mono font-bold text-blue-600 ml-1">${reward.code}</span>
                    </div>
                    <div>
                        <span class="text-sm text-gray-500">Claims:</span>
                        <span class="font-bold ml-1">${reward.redemptions}/${reward.maxRedemptions}</span>
                    </div>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div class="bg-blue-600 h-2.5 rounded-full" 
                        style="width: ${(reward.redemptions / reward.maxRedemptions) * 100}%"></div>
                </div>
            `;
            
            rewardsContainer.appendChild(rewardElement);
        }

        // Add new reward
        async function addNewReward(e) {
            e.preventDefault();
            
            const mainMessage = document.getElementById('main-message').value;
            const redeemLimit = parseInt(document.getElementById('redeem-limit').value);
            const rewardCode = document.getElementById('reward-code').value;
            const rewardDescription = document.getElementById('reward-description').value;
            
            if (!mainMessage || !redeemLimit || !rewardCode || !rewardDescription) {
                alert('Please fill all fields');
                return;
            }
            
            try {
                await addDoc(collection(db, "rewards"), {
                    mainMessage,
                    maxRedemptions: redeemLimit,
                    code: rewardCode,
                    rewardDescription,
                    redemptions: 0,
                    adminId: currentUser.uid,
                    createdAt: new Date()
                });
                
                rewardForm.reset();
                addRewardModal.classList.add('hidden');
                loadRewards();
            } catch (error) {
                console.error("Error adding reward: ", error);
                alert('Failed to add reward: ' + error.message);
            }
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', initApp);
        document.getElementById('login-form').addEventListener('submit', handleLogin);
        addRewardBtn.addEventListener('click', () => addRewardModal.classList.remove('hidden'));
        closeModal.addEventListener('click', () => addRewardModal.classList.add('hidden'));
        rewardForm.addEventListener('submit', addNewReward);
        logoutBtn.addEventListener('click', () => signOut(auth));
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * {
            font-family: 'Poppins', sans-serif;
        }
        .card {
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .modal {
            transition: all 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Login Form -->
    <div id="login-form" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-lock text-blue-600 text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Admin Login</h2>
                <p class="text-gray-600 mt-2">Enter your credentials to access the admin panel</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="email" placeholder="admin@example.com" 
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <div>
                    <label class="block text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" placeholder="••••••••" 
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <div id="error-message" class="text-red-500 text-sm hidden"></div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold flex items-center justify-center">
                        <span id="login-text">Login</span>
                        <i id="loading-indicator" class="fas fa-spinner fa-spin ml-2 hidden"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="hidden min-h-screen">
        <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white shadow-lg">
            <div class="container mx-auto px-4 py-5 flex justify-between items-center">
                <h1 class="text-2xl font-bold flex items-center">
                    <i class="fas fa-crown mr-2"></i> Reward System Admin
                </h1>
                <div class="flex items-center space-x-4">
                    <button id="logout-btn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg flex items-center">
                        <i class="fas fa-sign-out-alt mr-2"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <main class="container mx-auto px-4 py-8">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800">Manage Rewards</h2>
                <button id="add-reward-btn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg flex items-center">
                    <i class="fas fa-plus mr-2"></i> Add New Reward
                </button>
            </div>

            <div id="rewards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Rewards will be dynamically added here -->
            </div>
        </main>

        <!-- Add Reward Modal -->
        <div id="add-reward-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
            <div class="bg-white rounded-xl w-full max-w-md p-6 modal fade-in">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-gray-800">Create New Reward</h3>
                    <button id="close-modal" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <form id="reward-form" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 mb-2">Main Message</label>
                        <input type="text" id="main-message" placeholder="CONGRATULATIONS 🎊" 
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>

                    <div>
                        <label class="block text-gray-700 mb-2">Number of Redeems</label>
                        <input type="number" id="redeem-limit" placeholder="50" min="1" 
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>

                    <div>
                        <label class="block text-gray-700 mb-2">Reward Code</label>
                        <input type="text" id="reward-code" placeholder="Enter unique code" 
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>

                    <div>
                        <label class="block text-gray-700 mb-2">Reward Description</label>
                        <textarea id="reward-description" placeholder="What will the user receive?" 
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3" required></textarea>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold">
                            <i class="fas fa-plus mr-2"></i> Add Reward
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
